<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- Hello Travelpayouts -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نتائج البحث — Vrax Voyage</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
<script>
  function applyLang(l){var h=document.documentElement;h.setAttribute('lang',l);h.setAttribute('dir',l==='ar'?'rtl':'ltr');try{localStorage.setItem('vraxLang',l)}catch(e){}var b=document.getElementById('langBtn');if(b)b.textContent=(l==='ar'?'FR':'العربية');}
  function toggleLang(){var cur=document.documentElement.getAttribute('lang')||'ar';applyLang(cur==='ar'?'fr':'ar');}
  (function(){var l='ar';try{l=localStorage.getItem('vraxLang')||'ar'}catch(e){};applyLang(l);})();
  document.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('langBtn');if(b)b.textContent=(document.documentElement.getAttribute('lang')==='ar'?'FR':'العربية');});
</script>
<style>
  :root{--ink:#0E1A2B;--paper:#FAF7F2;--amber:#EE7B33;--text:#14202E;--muted:#5E6B7A;--line:rgba(20,32,46,.10)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",system-ui,sans-serif;color:var(--text);background:var(--paper);line-height:1.55}
  .wrap{width:min(1120px,92vw);margin-inline:auto}
  a{color:inherit;text-decoration:none}
  h1{font-family:"Space Grotesk",sans-serif;letter-spacing:-.02em}
  .ar{display:none}
  html[lang="ar"] .ar{display:inline}
  html[lang="ar"] .fr{display:none}
  html[lang="ar"] *{font-family:'Tajawal',system-ui,sans-serif !important}
  .langbtn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.24);color:#fff;font-weight:700;font-size:13px;padding:8px 15px;border-radius:100px;cursor:pointer;white-space:nowrap}
  .nav-right{display:flex;align-items:center;gap:14px}
  header{position:sticky;top:0;z-index:50;background:rgba(14,26,43,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
  .brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:"Space Grotesk";font-weight:700;font-size:20px}
  .brand .dot{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--amber);color:#fff;font-size:18px;transform:rotate(-8deg)}
  .back{color:#cdd6e2;font-size:14px;font-weight:500}
  .back:hover{color:#fff}
  .title{padding:30px 0 6px}
  .title .eye{font-family:"Space Mono";font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
  .title h1{font-size:clamp(24px,4vw,32px);margin-top:6px}
  .panel{background:#fff;border-radius:16px;box-shadow:0 18px 50px -18px rgba(14,26,43,.30);padding:14px 16px;margin:18px 0}
  #tpwl-tickets{margin-top:18px;min-height:200px}
  footer{background:var(--ink);color:#9fb2c6;padding:28px 0;margin-top:40px;font-size:12.5px}
  footer .mono{font-family:"Space Mono"}
</style>
<!-- White Label Travelpayouts (wl_id=18677) -->
<script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1">

    window.TPWL_CONFIGURATION = { ...window.TPWL_CONFIGURATION, resultsURL: "https://vrax-voyage.com/resultats.html", locale: "ar" };

    script.async = 1;

    script.src = "https://tpemd.com/wl_web/main.js?wl_id=18677";
    document.head.appendChild(script);
  })();

</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="/"><span class="dot">✈</span> Vrax Voyage</a>
    <div class="nav-right">
      <a class="back" href="/"><span class="fr">← Nouvelle recherche</span><span class="ar">بحث جديد ←</span></a>
      <button id="langBtn" class="langbtn" onclick="toggleLang()">FR</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="title">
    <div class="eye">// <span class="fr">Résultats</span><span class="ar">النتائج</span></div>
    <h1><span class="fr">Vos vols, comparés en direct</span><span class="ar">رحلاتك، مقارنة مباشرة</span></h1>
  </div>
  <div class="panel"><div id="tpwl-search"></div></div>
  <div id="tpwl-tickets"></div>
</div>

<footer>
  <div class="wrap" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
    <span>© 2026 Vrax Voyage</span>
    <span class="mono"><span class="fr">résultats fournis par nos partenaires</span><span class="ar">النتائج مقدمة من شركائنا</span></span>
  </div>
</footer>
</body>
</html>
